name: 🚀 Auto Posting Bot

on:
  schedule:
    # 매일 한국 시간 새벽 3시 (UTC 18시)에 알람 울림
    - cron: '0 18 * * *'
  workflow_dispatch: # 공주님이 깃허브 웹에서 수동으로 누를 수 있는 버튼

permissions:
  contents: write # 봇이 글을 쓰고 저장(Push)할 수 있는 권한 부여

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 코드 가져오기
      uses: actions/checkout@v3

    - name: 🐍 파이썬 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 부품(라이브러리) 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🎲 인간화 장치 (구글 회피용 랜덤 지연)
      run: |
        DELAY=$((RANDOM % 1800))
        echo "구글 알고리즘을 속이기 위해 ${DELAY}초 동안 대기합니다..."
        sleep $DELAY

    - name: ✍️ 제미나이 봇 실행 (비밀 금고에서 키 꺼내기!)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python bot.py

    - name: 🚀 깃허브에 새 글 자동 업로드 (Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/
        # 변경사항이 있을 때만 깃허브에 저장!
        git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 봇 사령관의 무인 자동화 포스팅 발행!" && git push)
