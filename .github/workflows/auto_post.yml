name: Auto Blog Posting Bot

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 🗂️ 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 3.10 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ⚙️ 깃허브 봇 계정 팩트 장착
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: ⏰ 인간화 지연 (실전 모드)
      run: |
        echo "구글 알고리즘을 속이기 위해 랜덤 잠복 후 기상합니다..."
        sleep $((RANDOM % 1800 + 60))

    - name: 🤖 12기통 봇 순차 가동 (10분 간격)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # 12개의 봇을 차례대로 배열에 담기
        bots=("bot.py" "bot_lunch.py" "bot_timer.py" "bot_converter.py" "bot_stock.py" "bot_medication.py" "bot_led.py" "bot_scanner.py" "bot_pdf.py" "bot_drug.py" "bot_show.py" "bot_pixel.py")
        
        for bot in "${bots[@]}"; do
          echo "========================================"
          echo "🚀 [$bot] 가동 시작..."
          python3 $bot
          
          # 글 하나 완성할 때마다 즉시 서버에 쏘아 올리기
          git add .
          git commit -m "🚀 [자동발행] $bot 포스팅 완료" || echo "변경 사항 없음"
          git pull --rebase || true
          git push
          
          # 마지막 봇(bot_pixel.py)이 아니면 다음 글까지 10분(600초) 대기!
          if [ "$bot" != "bot_pixel.py" ]; then
            echo "⏳ 사람처럼 보이기 위해 10분(600초)간 커피 한잔 마시고 옵니다..."
            sleep 600
          fi
        done
