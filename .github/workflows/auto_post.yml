name: Auto Blog Posting Bot

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

# 🚨 핵심 추가: 봇에게 저장소에 글을 덮어쓸 수 있는 막강한 권한(Write) 부여!
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 🗂️ 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 3.10 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ⏰ 인간화 지연 (어뷰징 회피용 Jitter)
      run: |
        echo "봇이 눈치를 보며 랜덤 휴식을 취합니다..."
        # 테스트를 위해 딜레이를 10초~30초로 확 줄일게! (나중에 다시 늘리면 됨)
        sleep $((RANDOM % 20 + 10))

    - name: 🤖 제미나이 봇 작동 및 포스팅 작성
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot.py

    - name: 🚀 깃허브 서버에 자동 Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🚀 [자동발행] 새벽에 봇이 은혜로운 글을 발행했습니다!" || echo "No changes to commit"
        git push
