name: Auto Blog Posting Bot

on:
  schedule:
    # 매일 한국 시간 새벽 1시(UTC 16시)에 알람 울림
    - cron: '0 16 * * *'
  workflow_dispatch: # 공주님이 수동으로 버튼 눌러서 쏠 수 있는 장치

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 🗂️ 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 3.10 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ⏰ 인간화 지연 (어뷰징 회피용 Jitter)
      run: |
        # 1분(60초) ~ 120분(7200초) 사이에서 랜덤하게 휴식 후 작동
        echo "봇이 눈치를 보며 랜덤 휴식을 취합니다..."
        sleep $((RANDOM % 7200 + 60))

    - name: 🤖 제미나이 봇 작동 및 포스팅 작성
      env:
        # 아까 공주님이 만든 깃허브 비밀금고에서 API 키를 꺼내옴!
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot.py

    - name: 🚀 깃허브 서버에 자동 Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        # 봇이 스스로 포장해서 깃허브에 올림
        git commit -m "🚀 [자동발행] 새벽에 봇이 은혜로운 글을 발행했습니다!" || echo "No changes to commit"
        git push
