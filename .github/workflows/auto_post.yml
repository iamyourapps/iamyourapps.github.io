name: Auto Blog Posting Bot

on:
  schedule:
    # 매일 한국 시간 새벽 1시(UTC 16시)에 알람 울림 (하루 1포스팅 유지!)
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 🗂️ 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 3.10 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ⏰ 인간화 지연 (실전 모드!)
      run: |
        echo "실전 모드 돌입: 구글을 완벽하게 속이기 위해 1분 ~ 120분 사이로 랜덤 잠복합니다..."
        sleep $((RANDOM % 7200 + 60))

    - name: 🤖 제미나이 봇 작동 및 포스팅 작성
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot.py

    - name: 🚀 깃허브 서버에 자동 Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🚀 [자동발행] 새벽에 봇이 은혜로운 글을 발행했습니다!" || echo "No changes to commit"
        git push
