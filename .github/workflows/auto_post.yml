name: Auto Blog Posting Bot

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 🗂️ 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 파이썬 3.10 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ⏰ 인간화 지연 (실전 모드)
      run: |
        echo "구글 눈치를 보며 랜덤 잠복 후 기상합니다..."
        sleep $((RANDOM % 7200 + 60))

    - name: 🤖 1호기(성경 앱) 가동
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot.py

    - name: 🤖 2호기(급식 앱) 가동
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot_lunch.py

    - name: 🤖 3호기(핏타이머 앱) 가동
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot_timer.py

    - name: 🤖 4호기(단위변환기 앱) 가동
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot_converter.py

    - name: 🤖 5호기(물타기 계산기) 가동
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python3 bot_stock.py

    - name: 🚀 깃허브 서버에 5기통 펜타코어 Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🚀 [자동발행] 새벽에 봇 군단이 5연속 포스팅을 완료했습니다!" || echo "No changes to commit"
        git push
